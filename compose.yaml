# flop-watch: the collector, Prometheus and Grafana (architecture §10).
# Quick start: cp .env.example .env && docker compose up -d, then open http://127.0.0.1:3000.
name: flop-watch

services:
  flop-watch:
    build: .
    image: flop-watch:${COLLECTOR_VERSION:-local}
    env_file:
      - path: .env
        required: false
    read_only: true
    restart: unless-stopped
    # Not published: Prometheus scrapes it on the Compose network.

  prometheus:
    image: prom/prometheus:v3.16.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=180d
      - --query.timeout=20s
      - --query.max-samples=5000000
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9090/-/ready"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      start_interval: 2s
    restart: unless-stopped
    # Not published: only Grafana queries it.

  grafana:
    image: grafana/grafana:13.3.2
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      # Grafana builds its links from it, and Grafana Live accepts WebSocket origins only from it.
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://127.0.0.1:${GRAFANA_PORT:-3000}/}
      # Anonymous, read-only access to the public dashboard (architecture §11).
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_ANONYMOUS_HIDE_VERSION: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_USERS_VIEWERS_CAN_EDIT: "false"
      GF_SNAPSHOTS_EXTERNAL_ENABLED: "false"
      GF_DASHBOARDS_MIN_REFRESH_INTERVAL: 30s
      # Grafana's own /metrics would be public too; flop-watch does not need it.
      GF_METRICS_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/flop-watch-overview.json
      # Nothing to grafana.com or gravatar.com.
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_SECURITY_DISABLE_GRAVATAR: "true"
    ports:
      - 127.0.0.1:${GRAFANA_PORT:-3000}:3000
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      start_interval: 2s
    restart: unless-stopped

volumes:
  prometheus-data:
  grafana-data:
