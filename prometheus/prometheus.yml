# Prometheus for flop-watch (architecture §7, §10). The rule files arrive with #13.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # The panels and FlopWatchDown select this job by name (dashboard.md §7).
  - job_name: flop-watch
    static_configs:
      # The collector's default port; a changed FLOPWATCH_PORT needs the same change here.
      - targets: ["flop-watch:10063"]
