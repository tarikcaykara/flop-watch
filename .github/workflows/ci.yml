name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  # A pull request's new push cancels its superseded run. Every main push gets its own group, so no
  # main run is cancelled, or replaced while pending, by the next merge.
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Reads the pnpm version from package.json "packageManager".
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint and format check
        run: pnpm check
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      # promtool check config, check rules and test rules, in the Prometheus image that compose.yaml
      # pins (architecture §7).
      - name: Prometheus config and rules
        run: pnpm test:rules
      - name: Collector image build
        run: docker build .
      # Last, so a registry outage or a new advisory never hides code results.
      - name: Dependency audit
        run: pnpm audit:deps

  # The Compose stack against the fake FLOP service (architecture §10); no FLOP host is contacted.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      # The fake FLOP service imports ws from the mounted node_modules.
      - run: pnpm install --frozen-lockfile
      - name: Stack e2e
        run: pnpm test:e2e
