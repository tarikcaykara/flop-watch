# Monthly version-update PRs (CLAUDE.md › Workflow › Dependabot).
# - A release is proposed only after a 7-day cooldown; security updates do not wait.
# - Minor and patch updates are grouped: `tooling` (dev dependencies) and `actions`, which Claude
#   merges after the reviewer pass and a green gate; `runtime` (@prometheus-io/client, the only
#   runtime dependency, still 0.x so a minor can break) and `images` (the Node base image in the
#   Dockerfile, Prometheus and Grafana in compose.yaml), which the owner merges.
# - Majors come one by one and the owner merges them.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      include: scope
    groups:
      runtime:
        dependency-type: production
        update-types: [minor, patch]
      tooling:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # @types/node follows the Node runtime (24 LTS); a new major is a deliberate runtime change.
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        update-types: [minor, patch]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      include: scope
    groups:
      images:
        update-types: [minor, patch]
    ignore:
      # The base image follows the Node runtime (24 LTS); a new major is a deliberate runtime change.
      - dependency-name: node
        update-types: [version-update:semver-major]
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      include: scope
    groups:
      images:
        update-types: [minor, patch]
